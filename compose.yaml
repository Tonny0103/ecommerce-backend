services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-ecommerce}
    ports:
      - 5432:5432
    volumes:
      - ecommerce:/var/lib/postgresql/ecommerce
volumes:
  ecommerce: